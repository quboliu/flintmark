# Release pipeline for Flintmark — the ONLY supported way to cut a release.
#
# Triggered by pushing a version tag (vX.Y.Z). Releasing from a clean checkout
# (never `vsce package` on a laptop, where a test-polluted out/ bloats the VSIX)
# guarantees the package contains only compiled runtime, and ties the release to
# a specific commit + this run.
#
#   git tag v0.28.0 && git push origin v0.28.0
#
# Flow: verify VS Code -> package a clean VSIX -> validate -> publish GitHub Release.
# Marketplace publication is optional when a PAT is available.
#
# The `marketplace` GitHub Environment limits access to the PAT to `main` and
# version tags. See .github/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual re-run; choose the matching existing version tag

# Never cancel a release mid-flight (a half-published version is worse than a
# queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify VS Code
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm run check:versions
      - run: npm run test:unit
      - run: npm run test:perf

  release:
    name: Package VSIX · GitHub Release · VS Marketplace
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: write # create/update the GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Resolve version + assert tag matches package.json
        id: ver
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${PKG}"
          fi
          if [ "$TAG" != "v${PKG}" ]; then
            echo "::error::tag ${TAG} does not match package.json version v${PKG}"
            exit 1
          fi
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$TAG_SHA" != "$CHECKOUT_SHA" ]; then
            echo "::error::workflow commit ${CHECKOUT_SHA} is not tagged ${TAG} (${TAG_SHA})"
            echo "::error::for a manual re-run, select the existing ${TAG} tag as the workflow ref"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${PKG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: Package VSIX (clean build via vscode:prepublish)
        run: npx @vscode/vsce package

      - name: Assert VSIX is well-formed
        run: |
          VSIX="$(ls flintmark-*.vsix)"
          echo "Packaged: ${VSIX} ($(du -h "$VSIX" | cut -f1))"
          # Positive: the compiled runtime MUST be present (else math/diagrams break).
          for f in out/extension.js out/webview.js out/webview.css out/mermaid.js; do
            unzip -l "$VSIX" | grep -qF "extension/${f}" \
              || { echo "::error::VSIX missing runtime file: ${f}"; exit 1; }
          done
          # Negative: dev/test artifacts MUST NOT leak (the local-package bloat bug).
          if unzip -l "$VSIX" | grep -Eq 'extension/out/(test|coverage|metrics|mutation|stryker)|extension/scripts/|extension/\.github/|\.cjs$'; then
            echo "::error::dev/test artifacts leaked into the VSIX:"
            unzip -l "$VSIX" | grep -E 'extension/out/(test|coverage|metrics|mutation|stryker)|extension/scripts/|extension/\.github/|\.cjs$'
            exit 1
          fi

      - name: Checksum VSIX
        run: sha256sum flintmark-*.vsix > SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## " v "([ ]|$)" { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Flintmark ${{ steps.ver.outputs.version }}" > RELEASE_NOTES.md
          fi
          echo "---- release notes ----"; cat RELEASE_NOTES.md

      - name: Create / update GitHub Release
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="Flintmark ${{ steps.ver.outputs.version }}"
          VSIX="flintmark-${{ steps.ver.outputs.version }}.vsix"
          CHECKSUMS="SHA256SUMS.txt"
          git fetch --force --tags origin "$TAG"
          TARGET="$(git rev-list -n 1 "$TAG")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md
          else
            CREATE_OUTPUT="$(gh release create "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --verify-tag --draft 2>&1)"
            echo "$CREATE_OUTPUT"
            CREATED_TAG="$(printf '%s\n' "$CREATE_OUTPUT" | sed -n 's#.*releases/tag/\([^/?[:space:]]*\).*#\1#p' | tail -n 1)"
            if printf '%s' "$CREATED_TAG" | grep -q '^untagged-'; then
              gh release edit "$CREATED_TAG" --tag "$TAG" --target "$TARGET" --verify-tag \
                --title "$TITLE" --notes-file RELEASE_NOTES.md --draft=true
            fi
          fi
          gh release upload "$TAG" "$VSIX" "$CHECKSUMS" --clobber
          gh release edit "$TAG" --draft=false --latest
          ACTUAL_TAG="$(gh release view "$TAG" --json tagName --jq '.tagName')"
          if [ "$ACTUAL_TAG" != "$TAG" ]; then
            echo "::error::GitHub Release tag mismatch: expected ${TAG}, got ${ACTUAL_TAG}"
            exit 1
          fi
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for asset in "$VSIX" "$(basename "$CHECKSUMS")"; do
            printf '%s\n' "$ASSETS" | grep -qxF "$asset" \
              || { echo "::error::GitHub Release missing asset ${asset}"; exit 1; }
            PUBLIC_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}"
            ready=false
            for _ in 1 2 3 4 5 6; do
              if curl -fsIL "$PUBLIC_URL" >/dev/null; then
                ready=true
                break
              fi
              sleep 5
            done
            if [ "$ready" != true ]; then
              echo "::error::GitHub Release asset is not publicly downloadable: ${PUBLIC_URL}"
              exit 1
            fi
          done

      - name: Check Marketplace publisher access
        id: marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VSCE_PAT is unavailable; GitHub Release completed and Marketplace publishing is intentionally skipped"
            exit 0
          fi
          npx @vscode/vsce verify-pat quboliu
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: steps.marketplace.outputs.available == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          npx @vscode/vsce publish
          --skip-duplicate
          --packagePath "$(ls flintmark-*.vsix)"
