name: Native metadata comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          mkdir candidate
          npx @vscode/vsce package --out candidate/
          node scripts/ci/candidate-manifest.mjs
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: baseline-candidate/
          run-id: 43808965011
          github-token: ${{ github.token }}
      - run: node scripts/ci/download-editor.mjs cursor
      - name: Compare unchanged workload with local metadata routing
        shell: bash
        run: |
          export FLINTMARK_REPO="$PWD" FLINTMARK_DEPS="$PWD" FLINTMARK_READY_GATE=1
          export FLINTMARK_READY_HELPERS="$PWD/test/acceptance"
          export FLINTMARK_STRESS_FILES=20000 FLINTMARK_STRESS_IMAGES=4200 FLINTMARK_STRESS_NOISE=1
          mkdir -p out/workspace-diagnostic
          { ulimit -Sa; ulimit -Ha; launchctl limit; sysctl hw.memsize vm.swapusage; } > out/workspace-diagnostic/environment.txt
          (while true; do date -u '+%Y-%m-%dT%H:%M:%SZ'; sysctl vm.swapusage; vm_stat; ps -axo pid=,ppid=,rss=,%cpu=,comm=; sleep 5; done) > out/workspace-diagnostic/memory.log 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          for trial in 1 2 3; do
            for mode in baseline native-stat; do
              candidate_dir=candidate
              if [ "$mode" = baseline ]; then candidate_dir=baseline-candidate; fi
              export FLINTMARK_VSIX="$PWD/$candidate_dir/flintmark-0.33.5.vsix"
              export FLINTMARK_CANDIDATE_MANIFEST="$PWD/$candidate_dir/manifest.json"
              export FLINTMARK_OUT="$PWD/out/workspace-diagnostic/$mode/trial-$trial"
              mkdir -p "$FLINTMARK_OUT"
              date -u '+%Y-%m-%dT%H:%M:%SZ' > "$FLINTMARK_OUT/started.txt"
              set +e
              node --require ./test/acceptance/readiness.cjs --require ./test/acceptance/installed-candidate.cjs test/acceptance/workspace-registered.mjs > "$FLINTMARK_OUT/runner.log" 2>&1
              code=$?
              set -e
              echo "$code" > "$FLINTMARK_OUT/exit-code.txt"
              date -u '+%Y-%m-%dT%H:%M:%SZ' > "$FLINTMARK_OUT/completed.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-metadata-comparison
          path: |
            out/workspace-diagnostic/
            !out/workspace-diagnostic/**/extensions/**
          retention-days: 14
          if-no-files-found: error
