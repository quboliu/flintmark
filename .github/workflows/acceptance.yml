name: macOS Cursor memory diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate/
          run-id: 43231060460
          github-token: ${{ github.token }}
      - run: node scripts/ci/download-editor.mjs cursor
      - run: |
          npm run compile
          npm run build:test
      - name: Full acceptance with external memory observations
        shell: bash
        run: |
          mkdir -p out/memory-observation
          {
            ulimit -Sa
            ulimit -Ha
            launchctl limit
            sysctl hw.memsize hw.ncpu vm.swapusage
            df -h
            printf 'NODE_OPTIONS=%s\n' "${NODE_OPTIONS-}"
            node -e 'console.log(require("v8").getHeapStatistics())'
          } > out/memory-observation/environment.txt 2>&1
          (
            while true; do
              date -u '+%Y-%m-%dT%H:%M:%SZ'
              sysctl vm.swapusage kern.memorystatus_vm_pressure_level 2>&1 || true
              vm_stat
              ps -axo pid=,ppid=,rss=,%cpu=,comm=
              sleep 5
            done
          ) > out/memory-observation/samples.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          node scripts/ci/run-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-cursor-memory-observation
          path: |
            out/memory-observation/
            out/acceptance/
            out/metrics/
            out/*.png
            !out/acceptance/**/extensions/**
            !out/acceptance/**/workspace/**
          retention-days: 14
          if-no-files-found: error
