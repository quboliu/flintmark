name: Workspace isolation diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          mkdir candidate
          npx @vscode/vsce package --out candidate/
          node scripts/ci/candidate-manifest.mjs
      - run: node scripts/ci/download-editor.mjs cursor
      - name: Three unprofiled isolation trials
        shell: bash
        run: |
          export FLINTMARK_REPO="$PWD" FLINTMARK_DEPS="$PWD" FLINTMARK_READY_GATE=1
          export FLINTMARK_READY_HELPERS="$PWD/test/acceptance"
          export FLINTMARK_VSIX="$PWD/candidate/flintmark-0.33.5.vsix"
          export FLINTMARK_CANDIDATE_MANIFEST="$PWD/candidate/manifest.json"
          export FLINTMARK_STRESS_FILES=20000 FLINTMARK_STRESS_IMAGES=4200 FLINTMARK_STRESS_NOISE=1
          for trial in 1 2 3; do
            for mode in baseline no-tree-watcher; do
            export FLINTMARK_DIAGNOSTIC_MODE="$mode"
            export FLINTMARK_OUT="$PWD/out/workspace-diagnostic/$mode/trial-$trial"
            mkdir -p "$FLINTMARK_OUT"
            set +e
            node --require ./test/acceptance/readiness.cjs --require ./test/acceptance/installed-candidate.cjs test/acceptance/workspace-registered.mjs > "$FLINTMARK_OUT/runner.log" 2>&1
            code=$?
            set -e
            echo "$code" > "$FLINTMARK_OUT/exit-code.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-directory-observation
          path: out/workspace-diagnostic/
          retention-days: 14
          if-no-files-found: error
